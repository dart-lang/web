name: package:js_interop
permissions: read-all

on:
  # Run CI on pushes to the main branch and on PRs.
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/js_interop.yaml'
      - 'js_interop/**'
  pull_request:
    paths:
      - '.github/workflows/js_interop.yaml'
      - 'js_interop/**'
  schedule:
    - cron: "0 0 * * 0"

defaults:
  run:
    working-directory: js_interop/

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ['3.10', beta, dev]
        test_config: ['-p chrome', '-p chrome -c dart2wasm', '-p node']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260
        with:
          sdk: ${{ matrix.sdk }}

      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
        if: ${{ matrix.sdk == 'dev' }}
      - run: dart analyze --fatal-infos
        if: ${{ matrix.sdk == 'dev' }}
      - run: dart analyze
        if: ${{ matrix.sdk != 'dev' }}
      - run: dart test ${{ matrix.test_config }}

# A CI configuration to auto-publish pub packages.

name: Publish
permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]
  push:
    tags: [ '[A-z]+-v[0-9]+.[0-9]+.[0-9]+' ]

jobs:
  publish:
    if: ${{ github.repository_owner == 'dart-lang' }}
    uses: dart-lang/ecosystem/.github/workflows/publish.yaml@cda8bd535dfbcff45010bc3c843d325682f944b2
    with:
      write-comments: false
    permissions:
      id-token: write
      pull-requests: write

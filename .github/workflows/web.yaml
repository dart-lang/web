name: package:web
permissions:
  contents: read

on:
  # Run CI on pushes to main or v1.1-stable and on PRs.
  push:
    branches: [ main, v1.1-stable ]
    paths:
      - '.github/workflows/web.yaml'
      - 'web/**'
  pull_request:
    paths:
      - '.github/workflows/web.yaml'
      - 'web/**'
  schedule:
    - cron: "0 0 * * 0"

defaults:
  run:
    working-directory: web/

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ['3.13', dev]
        test_config: ['-p chrome', '-p chrome -c dart2wasm']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: ${{ matrix.sdk }}

      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
        if: ${{ matrix.sdk == 'dev' }}
      - run: dart analyze --fatal-infos
        if: ${{ matrix.sdk == 'dev' }}
      - run: dart analyze
        if: ${{ matrix.sdk != 'dev' }}
      - run: dart test ${{ matrix.test_config }}
      - run: dart test -p vm test/dart_fix_test.dart
        if: ${{ matrix.test_config == '-p chrome' }}

      # Validate the 'dart fix' metadata.
      - run: dart fix --compare-to-golden test_fixes

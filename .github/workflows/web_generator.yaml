name: package:web_generator
permissions:
  contents: read

on:
  # Run CI on pushes to the main branch and on PRs.
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/web_generator.yaml'
      - 'web_generator/**'
      - 'js_interop_gen/**'
  pull_request:
    paths:
      - '.github/workflows/web_generator.yaml'
      - 'web_generator/**'
      - 'js_interop_gen/**'
  schedule:
    - cron: "0 0 * * 0"

defaults:
  run:
    working-directory: web_generator/

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ['3.12', dev]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: ${{ matrix.sdk }}

      - run: dart pub get
      - run: dart analyze --fatal-infos
        if: matrix.sdk == 'dev'
      - run: dart analyze
        if: matrix.sdk != 'dev'
      - run: dart test

  # test bin/update_idl_bindings.dart
  test_generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d

      - run: npm install
      - run: dart pub get
      - run: dart pub -C ../web get
      - run: dart pub -C ../js_interop_gen get
      - run: dart bin/update_idl_bindings.dart
      - run: dart analyze --fatal-infos ../web

  # test bin/update_idl_bindings.dart --generate-all
  test_generate_all:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d

      - run: npm install
      - run: dart pub get
      - run: dart pub -C ../web get
      - run: dart pub -C ../js_interop_gen get
      - run: dart bin/update_idl_bindings.dart --generate-all
      - run: dart analyze --fatal-infos ../web
